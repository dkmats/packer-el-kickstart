name: packer-fmt
on:
  pull_request:
permissions:
  contents: read
jobs:
  packer-fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Install aqua
        uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.62.3
          aqua_args: i -l
      - name: Format packer files
        run: packer fmt .
      - name: Run autofix.ci
        uses: autofix-ci/action@v1.3.4
